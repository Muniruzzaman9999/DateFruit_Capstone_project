[pytest]
# Run from inside backend/:   ..\.venv\Scripts\python.exe -m pytest
testpaths = tests

# Lets the tests do `import app...` when pytest is started from backend/,
# without needing the package to be pip-installed.
pythonpath = .

# -ra prints a short summary of anything that was not a plain pass, so skipped
# tests explain themselves instead of appearing as a silent dot.
addopts = -ra --strict-markers

markers =
    slow: loads the real 330 MB Keras model. Skip with: -m "not slow"
